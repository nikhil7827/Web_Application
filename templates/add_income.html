<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Paycheck / Income</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Inter", sans-serif; }
        .card { max-width: 500px; margin: 60px auto; padding: 25px; border-radius: 10px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #198754; border: none; }
    </style>
</head>
<body>
<div class="card">
    <h4 class="text-center text-success mb-4">💵 Add Paycheck / Income</h4>
    <form method="POST">
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" id="description" name="description" class="form-control" placeholder="e.g. Monthly Salary" required>
        </div>
        <div class="mb-3">
            <label for="amount" class="form-label">Amount ($)</label>
            <input type="number" step="0.01" id="amount" name="amount" class="form-control" placeholder="4000" required>
        </div>
        <div class="d-flex justify-content-between">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">⬅ Back</a>
            <button type="submit" class="btn btn-primary">💾 Save Income</button>
        </div>
    </form>
</div>
</body>
</html>
