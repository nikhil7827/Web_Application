<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>✏️ Update Expense | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(90deg, #007bff, #00c6ff);
        }
        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
            letter-spacing: 1px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #fff;
            border-bottom: none;
            text-align: center;
        }
        .btn-update {
            background-color: #28a745;
            color: white;
            border: none;
            transition: 0.3s ease;
        }
        .btn-update:hover {
            background-color: #218838;
            transform: scale(1.03);
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
            border: none;
            transition: 0.3s ease;
        }
        .btn-cancel:hover {
            background-color: #5a6268;
            transform: scale(1.03);
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg mb-5">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">💰 Expense Tracker</a>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-light me-2">🏠 Home</a>
            <a href="{{ url_for('summary') }}" class="btn btn-success">📊 View Summary</a>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card p-4" style="width: 30rem;">
        <div class="card-header mb-3">
            <h3 class="text-warning fw-bold">✏️ Update Expense</h3>
        </div>

        <form method="POST" action="{{ url_for('update_expense', id=expense.id) }}">
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" id="description" name="description"
                       value="{{ expense.description }}" required>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">Amount ($)</label>
                <input type="number" step="0.01" class="form-control" id="amount" name="amount"
                       value="{{ expense.amount }}" required>
            </div>

            <div class="mb-4">
                <label for="category" class="form-label">Category</label>
                <input type="text" class="form-control" id="category" name="category"
                       value="{{ expense.category }}" required>
            </div>

            <!-- ✅ Update and Cancel buttons -->
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-update px-2 py-2">💾 Update</button>
                <a href="{{ url_for('index') }}" class="btn btn-cancel px-2 py-2">❌ Cancel</a>
            </div>
        </form>
    </div>
</div>

<div class="footer">
    <p>© {{ datetime.utcnow().year }} Expense Tracker | Built with ❤️ using Flask + Bootstrap</p>
</div>

</body>
</html>
