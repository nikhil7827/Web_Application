<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">📊 Expense Summary</h2>

    <form class="row g-3 mb-4" method="get" action="{{ url_for('summary') }}">
        <div class="col-auto">
            <select name="month" class="form-select">
                <option value="">All Months</option>
                {% for m in range(1, 13) %}
                <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary">Filter</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
        </div>
    </form>

    {% if warning %}
    <div class="alert alert-danger">{{ warning }}</div>
    {% endif %}

    <h4>Total Spent: ${{ total }}</h4>

    {% if categories %}
    <table class="table table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>Category</th>
                <th>Total Amount ($)</th>
            </tr>
        </thead>
        <tbody>
            {% for category, amount in categories.items() %}
            <tr>
                <td>{{ category }}</td>
                <td>{{ amount }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <div class="alert alert-info text-center">No expenses to summarize.</div>
    {% endif %}
</div>
</body>
</html>
