<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>➕ Add Expense | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(90deg, #007bff, #00c6ff);
        }
        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
            letter-spacing: 1px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-save {
            background-color: #198754;
            color: white;
        }
        .btn-save:hover {
            background-color: #157347;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg mb-5">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">💰 Expense Tracker</a>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-light">🏠 Home</a>
            <a href="{{ url_for('summary') }}" class="btn btn-success">📊 View Summary</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card p-4">
                <h3 class="text-center mb-4 text-primary">➕ Add New Expense</h3>
                <form action="{{ url_for('add_expense') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="e.g., Grocery Shopping" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount ($)</label>
                        <input type="number" name="amount" class="form-control" step="any" min="0" placeholder="e.g., 25.50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="" disabled selected>Select category</option>
                            <option>Food</option>
                            <option>Transportation</option>
                            <option>Entertainment</option>
                            <option>Shopping</option>
                            <option>Utilities</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-save btn-lg me-2">💾 Save Expense</button>
                        <a href="{{ url_for('index') }}" class="btn btn-cancel btn-lg">↩ Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
