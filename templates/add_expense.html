<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4 text-center">➕ Add New Expense</h2>
    <form action="{{ url_for('add_expense') }}" method="POST" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" name="description" class="form-control" placeholder="e.g. Grocery shopping" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount ($)</label>
            <input type="number" name="amount" step="100" class="form-control" placeholder="e.g. 25.50" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" placeholder="e.g. Food, Transport" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-success">Save Expense</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
